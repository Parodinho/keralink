{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - KERALINK</title>
    <link rel="stylesheet" href="{% static 'voyageurs/css/style.css' %}">
</head>
<body>
    <div class="container" style="max-width: 480px; margin: 80px auto;">
        <div class="form-card">
            <h3>🔑 Connexion à votre compte</h3>
            
            <div class="form-group">
                <label>Nom d'utilisateur ou Email</label>
                <input type="text" id="login-identifiant" placeholder="Username ou email" required>
            </div>

            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="login-password" required>
            </div>

            <button onclick="performLogin()" class="submit-btn">Se connecter</button>

            <p style="text-align:center; margin-top:25px; color:#666;">
                Pas de compte ? 
                <span onclick="showPage(null, 'profil')" style="color:var(--orange); cursor:pointer; text-decoration:underline;">Créer un compte</span>
            </p>
        </div>
    </div>

    <script src="{% static 'voyageurs/js/script.js' %}"></script>
</body>
</html>
