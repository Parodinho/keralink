{% load static %}
{% load i18n %}
{% get_current_language as LANGUAGE_CODE %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Connexion - KERALINK" %}</title>
    <link rel="stylesheet" href="{% static 'voyageurs/css/style.css' %}">
</head>
<body>
    <div class="container" style="max-width: 480px; margin: 80px auto;">
        <div class="form-card">
            <h3>🔑 {% trans "Connexion à votre compte" %}</h3>
            
            <div class="form-group">
                <label>{% trans "Nom d'utilisateur ou Email" %}</label>
                <input type="text" id="login-identifiant" placeholder="{% trans 'Username ou email' %}" required>
            </div>

            <div class="form-group">
                <label>{% trans "Mot de passe" %}</label>
                <input type="password" id="login-password" required>
            </div>

            <button onclick="performLogin()" class="submit-btn">{% trans "Se connecter" %}</button>

        </div>
    </div>

    <script src="{% static 'voyageurs/js/script.js' %}"></script>
</body>
</html>
